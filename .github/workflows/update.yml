# Follows Claude Code, so nobody has to.
name: Agent version update
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

on:
    schedule:
        # Weekly, Monday 05:17 UTC: each agent repository has a weekday of its own.
        - cron: '17 5 * * 1'
    workflow_dispatch:
        inputs:
            version:
                description: 'Pin this exact version instead of asking upstream'
                required: false
            channel:
                description: "Which pointer to follow when no version is given"
                required: false
                default: stable

# Read by every Maven call, the pinned-jdk action's too: Maven asks for a newer snapshot once a day, and a
# cache restored the day Porelo publishes would keep yesterday's. Never run on a tag.
env:
    MAVEN_ARGS: -U

# Read-only for the workflow; the job below takes the two it needs to write, and no more.
permissions:
    contents: read

# Never two at once.
concurrency:
    group: update
    cancel-in-progress: false

jobs:

    update:
        name: Follow Claude Code
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        # Pushes the pin's branch and opens its pull request: these two, for this job only.
        permissions:
            contents: write
            pull-requests: write

        steps:

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Before the lookup, which is Porelo's release tool; and before anything is rented, so the
            # cleanup below always has something to run.
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            - name: Resolve the release and machine tooling
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # ------------------------------------------------------------------ detect

            # Through env, never interpolated into the script, so no value can become shell.
            - name: What does upstream publish
              id: detect
              env:
                  CHANNEL: ${{ inputs.channel || 'stable' }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -eu
                  # A dispatch answers for the channel, so 'major' is still measured against what is pinned.
                  if [ -n "${VERSION:-}" ]; then
                      java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main upstream-version \
                          --channel "$CHANNEL" --upstream "$VERSION"
                  else
                      java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main upstream-version --channel "$CHANNEL"
                  fi

            - name: What this run will do
              id: plan
              env:
                  UPDATE: ${{ steps.detect.outputs.update }}
                  UPSTREAM: ${{ steps.detect.outputs.upstream }}
                  PINNED: ${{ steps.detect.outputs.pinned }}
                  SOURCE: ${{ steps.detect.outputs.source }}
                  WAITING: ${{ steps.detect.outputs.waiting }}
              run: |
                  set -eu
                  if [ "$UPDATE" = "yes" ]; then
                      echo "target=$UPSTREAM" >> "$GITHUB_OUTPUT"
                      echo "proceed=yes" >> "$GITHUB_OUTPUT"
                      echo "This module pins $PINNED; the target is $UPSTREAM."
                  elif [ "$UPDATE" = "rollback" ]; then
                      # Nothing is built or rented: a verified downgrade is not what decides this.
                      echo "proceed=no" >> "$GITHUB_OUTPUT"
                      echo "STOP=$SOURCE points at $UPSTREAM, older than the pinned $PINNED" >> "$GITHUB_ENV"
                      echo "Either upstream withdrew $PINNED, or it was pinned from another pointer."
                      echo "To go back deliberately, dispatch this workflow with version=$UPSTREAM."
                      echo "Until one of the two moves, every scheduled run stops here."
                  elif [ -n "${WAITING:-}" ]; then
                      echo "proceed=no" >> "$GITHUB_OUTPUT"
                      echo "Claude Code $UPSTREAM is out, but younger than the pom's porelo.release.min-age."
                      echo "It is taken from $WAITING on. $PINNED stays pinned until then."
                  else
                      echo "proceed=no" >> "$GITHUB_OUTPUT"
                      echo "Claude Code $PINNED is still what the channel points at."
                      echo "Nothing to do. This is the ordinary outcome of this job."
                  fi

            # ------------------------------------------------------------------ apply

            - name: Pin it
              if: steps.plan.outputs.proceed == 'yes'
              env:
                  TARGET: ${{ steps.plan.outputs.target }}
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main update "$TARGET"

            # ------------------------------------------------------------------ verify

            # Gates write STOP rather than failing, so the run can still clean up after itself.
            - name: Unit tests
              if: steps.plan.outputs.proceed == 'yes'
              run: |
                  ./mvnw -B -s settings.xml verify || echo "STOP=the unit suite failed" >> "$GITHUB_ENV"

            # Nothing else enforces that the version and the digest agree;
            - name: The pin agrees everywhere it is written
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin \
                      || echo "STOP=the pinned version and digest disagree" >> "$GITHUB_ENV"

            # A subscription login is renewed with a token URL and client id read out of the binary, and a
            # release that moves them breaks renewal while every other gate stays green.
            - name: The pinned CLI still renews where the adapter says
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              run: |
                  set -eu
                  EXTRACTOR=src/main/java/org/fuin/porelo/agent/impl/claude/ClaudeCredentialExtractor.java
                  TOKEN_URL="$(sed -n 's|^    static final String TOKEN_URL = "\(.*\)";$|\1|p' "$EXTRACTOR")"
                  CLIENT_ID="$(sed -n 's|^    static final String CLIENT_ID = "\(.*\)";$|\1|p' "$EXTRACTOR")"
                  # The pin is the pom property; claude.yaml names the download with it in place of the version.
                  VERSION="$(sed -n 's|^        <agent.cli.version>\(.*\)</agent.cli.version>$|\1|p' pom.xml | head -1)"
                  TEMPLATE="$(sed -n 's|^        - url: \(.*\)$|\1|p' src/main/resources/agent/claude.yaml | head -1)"
                  SHA256="$(sed -n 's|^          sha256: "\(.*\)"$|\1|p' src/main/resources/agent/claude.yaml | head -1)"
                  if [ -z "$TOKEN_URL" ] || [ -z "$CLIENT_ID" ] || [ -z "$VERSION" ] || [ -z "$TEMPLATE" ] || [ -z "$SHA256" ]; then
                      echo "STOP=the token URL, client id or pinned download could not be read" >> "$GITHUB_ENV"
                      exit 0
                  fi
                  BIN="target/claude-$VERSION"
                  if ! curl -sfL -o "$BIN" "${TEMPLATE//'${agent.cli.version}'/$VERSION}" \
                          || ! echo "$SHA256  $BIN" | sha256sum -c -; then
                      echo "STOP=Claude Code $VERSION could not be downloaded as pinned" >> "$GITHUB_ENV"
                      exit 0
                  fi
                  # Its production endpoints, one object literal; the development one starts with localhost.
                  BLOCK="$(LC_ALL=C grep -aoE 'BASE_API_URL:"https://api.anthropic.com",[^}]*' "$BIN" || true)"
                  if printf '%s\n' "$BLOCK" | grep -qF "TOKEN_URL:\"$TOKEN_URL\"" \
                          && printf '%s\n' "$BLOCK" | grep -qF "CLIENT_ID:\"$CLIENT_ID\""; then
                      echo "  OK    Claude Code $VERSION renews at $TOKEN_URL as $CLIENT_ID"
                  else
                      echo "STOP=Claude Code $VERSION no longer names the token URL or client id the adapter renews with" >> "$GITHUB_ENV"
                  fi

            # Not -DskipTests: that also skips NativeLinkageCheck, the one test that needs the binary.
            - name: Native binary and packages
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              run: |
                  ./mvnw -B -s settings.xml -Pnative,dist verify \
                      -Dagent.snapshot.run=${{ github.run_number }} \
                      || echo "STOP=the packages did not build" >> "$GITHUB_ENV"

            # claude-code carries its version in its purl, so without --expect-moved this stops every time.
            - name: What else changed in the shipped tree
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main compare-bills \
                      target/porelo-agent-claude.cdx.json \
                      https://fuinorg.jfrog.io/artifactory/porelo-dist-deb/pool/main/p/porelo-agent-claude/porelo-agent-claude.cdx.json \
                      --expect-moved claude-code \
                      > target/bill-change.txt 2>&1 \
                      || echo "STOP=third-party components or licenses changed" >> "$GITHUB_ENV"
                  # In a file as well, so the pull request can carry it rather than only the run log.
                  cat target/bill-change.txt

            - name: The major version moved
              if: steps.plan.outputs.proceed == 'yes' && steps.detect.outputs.major == 'moved'
              env:
                  WAS: ${{ steps.detect.outputs.pinned }}
                  TARGET: ${{ steps.plan.outputs.target }}
              run: |
                  echo "STOP=the upstream major version moved" >> "$GITHUB_ENV"
                  echo "::warning::$WAS -> $TARGET"
                  echo "A major release changes flags, configuration or an extension API by definition."

            # Without the key the credential scenarios skip themselves, and both legs pass having proved less.
            - name: The acceptance key is there
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              env:
                  KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
              run: |
                  [ -n "$KEY" ] || echo "STOP=the secret OPEN_ROUTER_API_KEY is empty, so the credential scenarios would be skipped" >> "$GITHUB_ENV"

            - name: Acceptance - ubuntu
              timeout-minutes: 30
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
                  PORELO_CI_LEG: upd-ubuntu
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
                  PORELO_E2E_EXPECT_CLI: ${{ steps.plan.outputs.target }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os ubuntu --package porelo-agent-claude \
                      --cucumber . --candidate target \
                      || echo "STOP=acceptance failed on ubuntu" >> "$GITHUB_ENV"

            - name: Acceptance - fedora
              timeout-minutes: 30
              if: steps.plan.outputs.proceed == 'yes' && !env.STOP
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
                  PORELO_CI_LEG: upd-fedora
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
                  PORELO_E2E_EXPECT_CLI: ${{ steps.plan.outputs.target }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os fedora --package porelo-agent-claude \
                      --cucumber . --candidate target \
                      || echo "STOP=acceptance failed on fedora" >> "$GITHUB_ENV"

            - name: Delete what this run created
              if: always() && steps.plan.outputs.proceed == 'yes'
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  PORELO_CI_LEG: upd-ubuntu
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

            - name: Delete what this run created - fedora leg
              if: always() && steps.plan.outputs.proceed == 'yes'
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  PORELO_CI_LEG: upd-fedora
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

            # ------------------------------------------------------------------ ask, or publish

            - name: Open the pull request
              id: request
              if: always() && steps.plan.outputs.proceed == 'yes'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TARGET: ${{ steps.plan.outputs.target }}
                  WAS: ${{ steps.detect.outputs.pinned }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  set -eu
                  # A step ended by its limit, the job's or a cancel writes no STOP: anything but success is one.
                  if [ "$JOB_STATUS" != success ] && [ -z "${STOP:-}" ]; then
                      STOP="a step before this one ended the job as $JOB_STATUS"
                  fi
                  git config user.name 'porelo-update'
                  git config user.email 'noreply@fuin.org'
                  if git diff --quiet; then
                      echo "nothing was written - there is no change to propose"
                      exit 0
                  fi
                  BRANCH="update/claude-code-$TARGET"
                  git checkout -b "$BRANCH"
                  git commit -am "Pin Claude Code $TARGET"
                  # A branch moves only from its own main: one left by a closed request, or under an open one made
                  # on an older main, holds that main's workflows, and moving it would move them, which this job's
                  # token may never do. Such a branch is deleted first; its open request is closed and named by the
                  # fresh one.
                  OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
                  REPLACES=""
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
                      BEHIND=""
                      if [ -n "$OPEN" ]; then
                          BEHIND="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$BRANCH" --jq .behind_by)"
                      fi
                      if [ "$BEHIND" != 0 ]; then
                          if [ -n "$OPEN" ]; then
                              gh pr close "$OPEN" --comment "Made on an older main; run $GITHUB_RUN_NUMBER opens a fresh request."
                              REPLACES="$OPEN"
                              OPEN=""
                          fi
                          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null
                      fi
                  fi
                  # The checkout keeps no token, so only this push gets it: built here by printf, a builtin,
                  # into base64 on stdin, so it is in no argument list and in no later step.
                  (
                      HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
                      echo "::add-mask::$HEADER"
                      export GIT_CONFIG_COUNT=1
                      export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
                      GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $HEADER"
                      export GIT_CONFIG_VALUE_0
                      git push --force origin "$BRANCH"
                  )

                  {
                    echo "\`$WAS\` -> \`$TARGET\`, applied by Porelo's release tool: the"
                    echo "\`agent.cli.version\` property and the SHA-256 read from the manifest Anthropic"
                    echo "publishes for that release. Everything else naming the version is filtered from"
                    echo "the property and could not drift."
                    echo
                    if [ -n "${STOP:-}" ]; then
                        echo "**This is not ready to publish: $STOP.**"
                        echo "Automation is not allowed to decide this one - see the run log above."
                        if [ -s target/bill-change.txt ]; then
                            echo
                            echo "<details><summary>What changed in the shipped tree</summary>"
                            echo
                            echo '```'
                            cat target/bill-change.txt
                            echo '```'
                            echo
                            echo "</details>"
                        fi
                    else
                        echo "**Green.** Unit suite, the pin check against the published manifest, both"
                        echo "packages, an unchanged third-party component set, and the acceptance suites"
                        echo "on Ubuntu and Fedora against these packages rather than the published ones."
                    fi
                  } > target/pull-request.md
                  # A weekly job reaches the same version twice whenever the first attempt stopped.
                  if [ -n "$REPLACES" ]; then
                      printf '\nReplaces #%s, made on an older `main`.\n' "$REPLACES" >> target/pull-request.md
                  fi
                  if [ -n "$OPEN" ]; then
                      gh pr comment "$BRANCH" --body-file target/pull-request.md
                      echo "the request for $TARGET was already open - re-verified, and said so on it"
                  else
                      gh pr create --title "Pin Claude Code $TARGET" --body-file target/pull-request.md \
                                   --head "$BRANCH" --base main
                  fi
                  echo "opened=yes" >> "$GITHUB_OUTPUT"

            # Auto-merge needs its own token: the default one does not trigger a further workflow.
            - name: Merge, or say why not
              if: always() && steps.request.outputs.opened == 'yes'
              env:
                  GH_TOKEN: ${{ secrets.PORELO_UPDATE_TOKEN || github.token }}
                  AUTO: ${{ vars.PORELO_UPDATE_AUTO_MERGE }}
                  HAVE_TOKEN: ${{ secrets.PORELO_UPDATE_TOKEN != '' }}
                  TARGET: ${{ steps.plan.outputs.target }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  set -eu
                  # As in the request: a step ended by a limit or a cancel wrote no STOP.
                  if [ "$JOB_STATUS" != success ] && [ -z "${STOP:-}" ]; then
                      STOP="a step before this one ended the job as $JOB_STATUS"
                  fi
                  if [ -n "${STOP:-}" ]; then
                      echo "Not merging: $STOP."
                      echo "The branch is open for whoever decides it."
                  elif [ "$AUTO" != "true" ]; then
                      echo "Not merging: the repository variable PORELO_UPDATE_AUTO_MERGE is '${AUTO:-unset}'."
                      echo "Everything passed. Merging the pull request publishes Claude Code $TARGET."
                      echo "Set the variable to 'true' when these runs have been watched enough."
                  elif [ "$HAVE_TOKEN" != "true" ]; then
                      echo "::error::PORELO_UPDATE_AUTO_MERGE is on but the secret PORELO_UPDATE_TOKEN is not set."
                      echo "Merging with the workflow's own token triggers no build, so nothing would be"
                      echo "published and the run would look successful. Refusing to merge."
                      exit 1
                  else
                      gh pr merge --merge --delete-branch "update/claude-code-$TARGET"
                      echo "Merged. The push to main builds and publishes Claude Code $TARGET."
                  fi

            # Red means there is something to look at, and only that.
            - name: Stop
              if: always() && env.STOP
              run: |
                  echo "::error::$STOP"
                  exit 1
